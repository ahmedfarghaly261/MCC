services:
  telemetry-api:
    image: mcc-simulator:local
    build:
      context: .
      dockerfile: Dockerfile
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    ports:
      - "8080:8080"
    volumes:
      - skyfield_data:/root/skyfield-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  image-sim:
    image: mcc-simulator:local
    pull_policy: never
    command: uvicorn image_simulator:app --host 0.0.0.0 --port 8084
    ports:
      - "8084:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8084/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  command-sim:
    image: mcc-simulator:local
    pull_policy: never
    command: uvicorn command2:app --host 0.0.0.0 --port 8081
    environment:
      TELEMETRY_API_URL: http://telemetry-api:8080
      IMAGE_API_URL: http://image-sim:8084
    ports:
      - "8081:8081"
    depends_on:
      telemetry-api:
        condition: service_healthy
      image-sim:
        condition: service_healthy

  decoder:
    image: mcc-simulator:local
    pull_policy: never
    command: uvicorn decoder2:app --host 0.0.0.0 --port 8082
    environment:
      SIMULATOR_API: http://telemetry-api:8080
    ports:
      - "8082:8082"
    depends_on:
      telemetry-api:
        condition: service_healthy

volumes:
  skyfield_data:
