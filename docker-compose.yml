services:
  frontend:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    ports:
      - "${APP_PORT:-80}:80"
    depends_on:
      api:
        condition: service_healthy
      reverb:
        condition: service_started
    networks:
      - mcc

  api:
    image: mcc-api:local
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      APP_NAME: ${APP_NAME:-MCCS-Backend}
      APP_ENV: ${APP_ENV:-local}
      APP_DEBUG: ${APP_DEBUG:-true}
      APP_KEY: ${APP_KEY:-}
      APP_URL: ${APP_URL:-http://localhost}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mccs}
      DB_USERNAME: ${DB_USERNAME:-mcc}
      DB_PASSWORD: ${DB_PASSWORD:-mcc_password}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: ${QUEUE_CONNECTION:-redis}
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SESSION_DOMAIN: ${SESSION_DOMAIN:-}
      SANCTUM_STATEFUL_DOMAINS: ${SANCTUM_STATEFUL_DOMAINS:-localhost,localhost:5173,127.0.0.1,127.0.0.1:5173}
      BROADCAST_CONNECTION: reverb
      REVERB_APP_ID: ${REVERB_APP_ID:-mcc-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-mcc-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-mcc-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      CONTAINER_ROLE: app
      ANOMALY_API_URL: ${ANOMALY_API_URL:-http://ml-anomaly:8000}
      ANOMALY_API_KEY: ${ANOMALY_API_KEY:-change-me-in-production}
      ENHANCEMENT_API_URL: ${ENHANCEMENT_API_URL:-http://ml-enhancement:8000}
      OBJECT_DETECTION_API_URL: ${OBJECT_DETECTION_API_URL:-http://ml-object-detection:8000}
      PANORAMA_API_URL: ${PANORAMA_API_URL:-http://ml-panorama:8000}
      SEGMENTATION_API_URL: ${SEGMENTATION_API_URL:-http://ml-segmentation:8000}
      SATELLITE_API_URL: ${SATELLITE_API_URL:-http://simulator-telemetry:8080}
      COMMAND_API_URL: ${COMMAND_API_URL:-ws://simulator-command:8081/ws/radio}
      DECODER_API_URL: ${DECODER_API_URL:-http://simulator-decoder:8082}
    expose:
      - "8000"
    command: php artisan serve --host=0.0.0.0 --port=8000
    volumes:
      - api-storage:/var/www/html/storage
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-anomaly:
        condition: service_healthy
      ml-enhancement:
        condition: service_healthy
      ml-object-detection:
        condition: service_healthy
      ml-panorama:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8000/up || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    networks:
      - mcc

  horizon:
    image: mcc-api:local
    pull_policy: never
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mccs}
      DB_USERNAME: ${DB_USERNAME:-mcc}
      DB_PASSWORD: ${DB_PASSWORD:-mcc_password}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      SATELLITE_API_URL: ${SATELLITE_API_URL:-http://simulator-telemetry:8080}
      COMMAND_API_URL: ${COMMAND_API_URL:-ws://simulator-command:8081/ws/radio}
      DECODER_API_URL: ${DECODER_API_URL:-http://simulator-decoder:8082}
      ANOMALY_API_URL: ${ANOMALY_API_URL:-http://ml-anomaly:8000}
      ANOMALY_API_KEY: ${ANOMALY_API_KEY:-change-me-in-production}
      ENHANCEMENT_API_URL: ${ENHANCEMENT_API_URL:-http://ml-enhancement:8000}
      OBJECT_DETECTION_API_URL: ${OBJECT_DETECTION_API_URL:-http://ml-object-detection:8000}
      PANORAMA_API_URL: ${PANORAMA_API_URL:-http://ml-panorama:8000}
      SEGMENTATION_API_URL: ${SEGMENTATION_API_URL:-http://ml-segmentation:8000}
      BROADCAST_CONNECTION: reverb
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      CONTAINER_ROLE: worker
    command: php artisan horizon
    volumes:
      - api-storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mcc

  scheduler:
    image: mcc-api:local
    pull_policy: never
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      DB_CONNECTION: mysql
      DB_HOST: db
      DB_PORT: 3306
      DB_DATABASE: ${DB_DATABASE:-mccs}
      DB_USERNAME: ${DB_USERNAME:-mcc}
      DB_PASSWORD: ${DB_PASSWORD:-mcc_password}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      CACHE_STORE: ${CACHE_STORE:-redis}
      QUEUE_CONNECTION: redis
      SESSION_DRIVER: ${SESSION_DRIVER:-redis}
      CONTAINER_ROLE: worker
    command: >-
      sh -c "while true; do php artisan schedule:run --no-interaction; sleep 60; done"
    volumes:
      - api-storage:/var/www/html/storage
    depends_on:
      api:
        condition: service_healthy
    networks:
      - mcc

  reverb:
    image: mcc-api:local
    pull_policy: never
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-local}
      APP_KEY: ${APP_KEY:-}
      REDIS_CLIENT: predis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REVERB_APP_ID: ${REVERB_APP_ID:-mcc-local}
      REVERB_APP_KEY: ${REVERB_APP_KEY:-mcc-local-key}
      REVERB_APP_SECRET: ${REVERB_APP_SECRET:-mcc-local-secret}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SERVER_HOST: 0.0.0.0
      REVERB_SERVER_PORT: 8080
      CONTAINER_ROLE: worker
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - mcc

  ml-anomaly:
    image: mcc-models:local
    build:
      context: ./apps/models
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: uvicorn fastAPIs.anomaly_main:app --host 0.0.0.0 --port 8000
    environment:
      ANOMALY_API_KEY: ${ANOMALY_API_KEY:-change-me-in-production}
      MODEL_PATH: /app/pkls/best_anomaly_modelV3.pkl
      SCALER_PATH: /app/pkls/scalerV3.pkl
      METADATA_PATH: /app/pkls/model_metadataV3.json
    ports:
      - "${ANOMALY_API_PORT:-8010}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); raise SystemExit(0 if d.get('model_loaded') and d.get('scaler_loaded') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - mcc

  ml-enhancement:
    image: mcc-models:local
    build:
      context: ./apps/models
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: uvicorn fastAPIs.enhance:app --host 0.0.0.0 --port 8000
    ports:
      - "${ENHANCEMENT_API_PORT:-8011}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 20s
    networks:
      - mcc

  ml-object-detection:
    image: mcc-models:local
    build:
      context: ./apps/models
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: uvicorn fastAPIs.obj_detection:app --host 0.0.0.0 --port 8000
    environment:
      DOTA_PKL: /app/pkls/object_detection/my_model.pkl
      DOTA_WEIGHTS: /app/pkls/object_detection/best(DOTA).pt
      BUILDING_WEIGHTS: /app/pkls/object_detection/best(Buildings).pt
    ports:
      - "${OBJECT_DETECTION_API_PORT:-8012}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import json,urllib.request; d=json.load(urllib.request.urlopen('http://localhost:8000/health', timeout=5)); raise SystemExit(0 if d.get('models', {}).get('dota') and d.get('models', {}).get('building') else 1)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - mcc

  ml-panorama:
    image: mcc-models:local
    build:
      context: ./apps/models
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: uvicorn fastAPIs.panorama_service:app --host 0.0.0.0 --port 8000
    environment:
      PANORAMA_CONFIG_PATH: /app/pkls/panorama/pipeline_config.pkl
    ports:
      - "${PANORAMA_API_PORT:-8013}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 60s
    networks:
      - mcc

  ml-segmentation:
    image: mcc-models:local
    build:
      context: ./apps/models
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: uvicorn fastAPIs.segmentation_api:app --host 0.0.0.0 --port 8000
    environment:
      SEGMENTATION_WEIGHTS_PATH: /app/pkls/water_segmentation_weights.pth
    ports:
      - "${SEGMENTATION_API_PORT:-8014}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=5)"]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 30s
    networks:
      - mcc

  simulator-telemetry:
    image: mcc-simulator:local
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    restart: unless-stopped
    command: uvicorn main:app --host 0.0.0.0 --port 8080
    ports:
      - "${SIMULATOR_TELEMETRY_PORT:-8080}:8080"
    volumes:
      - simulator-skyfield-data:/root/skyfield-data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - mcc

  simulator-images:
    image: mcc-simulator:local
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: uvicorn image_simulator:app --host 0.0.0.0 --port 8084
    ports:
      - "${SIMULATOR_IMAGES_PORT:-8084}:8084"
    healthcheck:
      test: ["CMD", "python", "-c", "import json, urllib.request; data = json.load(urllib.request.urlopen('http://localhost:8084/images/stats', timeout=3)); raise SystemExit(0 if data.get('missing_images') == 0 else 1)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s
    networks:
      - mcc

  simulator-command:
    image: mcc-simulator:local
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: uvicorn command2:app --host 0.0.0.0 --port 8081
    environment:
      TELEMETRY_API_URL: http://simulator-telemetry:8080
      IMAGE_API_URL: http://simulator-images:8084
    ports:
      - "${SIMULATOR_COMMAND_PORT:-8081}:8081"
    depends_on:
      simulator-telemetry:
        condition: service_healthy
      simulator-images:
        condition: service_healthy
    networks:
      - mcc

  simulator-decoder:
    image: mcc-simulator:local
    build:
      context: ./apps/simulator
      dockerfile: Dockerfile
    pull_policy: never
    restart: unless-stopped
    command: uvicorn decoder2:app --host 0.0.0.0 --port 8082
    environment:
      SIMULATOR_API: http://simulator-telemetry:8080
    ports:
      - "${SIMULATOR_DECODER_PORT:-8082}:8082"
    depends_on:
      simulator-telemetry:
        condition: service_healthy
    networks:
      - mcc

  db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-mccs}
      MYSQL_USER: ${DB_USERNAME:-mcc}
      MYSQL_PASSWORD: ${DB_PASSWORD:-mcc_password}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-change_me_root_password}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 15
    networks:
      - mcc

  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - mcc

  phpmyadmin:
    image: phpmyadmin:5.2-apache
    profiles: [tools]
    restart: unless-stopped
    ports:
      - "${PHPMYADMIN_PORT:-8090}:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    depends_on:
      db:
        condition: service_healthy
    networks:
      - mcc

networks:
  mcc:
    driver: bridge

volumes:
  api-storage:
  db-data:
  redis-data:
  simulator-skyfield-data:
