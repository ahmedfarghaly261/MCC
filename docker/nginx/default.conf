server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;

    # This is the magic line. 127.0.0.11 is the internal Docker DNS resolver.
    resolver 127.0.0.11 valid=30s;

    client_max_body_size 100M;

    location /app/ {
        # Using a variable here prevents Nginx from crashing if reverb is slow to start
        set $upstream_reverb http://reverb:8080; 
        
        proxy_pass $upstream_reverb;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        # You can do the same for the app container if needed
        set $upstream_app app:9000;
        fastcgi_pass $upstream_app;
        
        fastcgi_index index.php;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        include fastcgi_params;
        fastcgi_read_timeout 300;
    }

    location ~ /\.ht {
        deny all;
    }
}